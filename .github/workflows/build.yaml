name: Build Quartz from Vault

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4

      - name: Checkout Vault into content/
        uses: actions/checkout@v4
        with:
          repository: Kyaw-Thiha/Notes
          path: content
          # token only needed if vault repo is private:
          # token: ${{ secrets.VAULT_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install + build
        run: |
          npm ci
          npx quartz build
